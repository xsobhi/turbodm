[package]
name = "turbodm"
version = "1.4.3"
edition = "2024"
description = "Fast multi-connection download manager with browser integration"
license = "MIT"
repository = "https://github.com/xsobhi/turbodm"
keywords = ["download", "manager", "accelerator", "gtk4"]
categories = ["network-programming"]

[dependencies]
async-channel = "2.5.0"
dirs = "7.0.0"
futures-util = "0.3.34"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-util = "0.7.19"

[target.'cfg(target_os = "linux")'.dependencies]
gdk4-x11 = { version = "0.11", features = ["xlib"] }
ksni = "0.3.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
winresource = "0.1" # Windows icon, only used when building for Windows

# Linux packages, built by .github/workflows/release.yml (cargo deb / cargo generate-rpm)
[package.metadata.deb]
maintainer = "xsobhi <59281574+xsobhi@users.noreply.github.com>"
copyright = "xsobhi"
section = "net"
depends = "$auto"
provides = "tdm"
extended-description = """\
TurboDM downloads files over up to 32 connections at once, in the spirit of Internet Download \
Manager, with pause/resume that survives restarts and a browser extension for Firefox, Chrome, \
Brave and Chromium that hands downloads over with their cookies."""
conf-files = ["/etc/apt/sources.list.d/turbodm.sources"]
assets = [
    ["target/release/turbodm", "usr/bin/", "755"],
    ["packaging/linux/turbodm.desktop", "usr/share/applications/", "644"],
    ["data/turbodm.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/linux/io.github.xsobhi.TurboDM.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/linux/native-messaging/firefox.json", "usr/lib/mozilla/native-messaging-hosts/com.xsobhi.turbodm.json", "644"],
    ["packaging/linux/native-messaging/chrome.json", "etc/opt/chrome/native-messaging-hosts/com.xsobhi.turbodm.json", "644"],
    ["packaging/linux/native-messaging/chrome.json", "etc/chromium/native-messaging-hosts/com.xsobhi.turbodm.json", "644"],
    ["packaging/linux/native-messaging/chrome.json", "etc/opt/edge/native-messaging-hosts/com.xsobhi.turbodm.json", "644"],
    # updates through apt, like Chrome and VS Code do
    ["packaging/linux/turbodm.sources", "etc/apt/sources.list.d/", "644"],
    ["packaging/linux/turbodm-archive-keyring.gpg", "usr/share/keyrings/", "644"],
    ["dist/chrome/*", "usr/share/turbodm/extension/chrome/", "644"],
    ["dist/chrome/icons/*", "usr/share/turbodm/extension/chrome/icons/", "644"],
    ["dist/firefox/*", "usr/share/turbodm/extension/firefox/", "644"],
    ["dist/firefox/icons/*", "usr/share/turbodm/extension/firefox/icons/", "644"],
    ["dist/turbodm-firefox.xpi", "usr/share/turbodm/extension/", "644"],
    ["README.md", "usr/share/doc/turbodm/", "644"],
]

[package.metadata.generate-rpm]
license = "MIT"
summary = "Fast multi-connection download manager"
auto-req = "builtin"
assets = [
    { source = "target/release/turbodm", dest = "/usr/bin/turbodm", mode = "755" },
    { source = "packaging/linux/turbodm.desktop", dest = "/usr/share/applications/turbodm.desktop", mode = "644" },
    { source = "data/turbodm.svg", dest = "/usr/share/icons/hicolor/scalable/apps/turbodm.svg", mode = "644" },
    { source = "packaging/linux/io.github.xsobhi.TurboDM.metainfo.xml", dest = "/usr/share/metainfo/io.github.xsobhi.TurboDM.metainfo.xml", mode = "644" },
    { source = "packaging/linux/native-messaging/firefox.json", dest = "/usr/lib/mozilla/native-messaging-hosts/com.xsobhi.turbodm.json", mode = "644" },
    { source = "packaging/linux/native-messaging/firefox.json", dest = "/usr/lib64/mozilla/native-messaging-hosts/com.xsobhi.turbodm.json", mode = "644" },
    { source = "packaging/linux/native-messaging/chrome.json", dest = "/etc/opt/chrome/native-messaging-hosts/com.xsobhi.turbodm.json", mode = "644" },
    { source = "packaging/linux/native-messaging/chrome.json", dest = "/etc/chromium/native-messaging-hosts/com.xsobhi.turbodm.json", mode = "644" },
    { source = "dist/chrome/*", dest = "/usr/share/turbodm/extension/chrome/", mode = "644" },
    { source = "dist/chrome/icons/*", dest = "/usr/share/turbodm/extension/chrome/icons/", mode = "644" },
    { source = "dist/firefox/*", dest = "/usr/share/turbodm/extension/firefox/", mode = "644" },
    { source = "dist/firefox/icons/*", dest = "/usr/share/turbodm/extension/firefox/icons/", mode = "644" },
    { source = "dist/turbodm-firefox.xpi", dest = "/usr/share/turbodm/extension/turbodm-firefox.xpi", mode = "644" },
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[dev-dependencies]
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
