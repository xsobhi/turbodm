# Builds every package and publishes a GitHub release when a version tag is pushed:
#   git tag v1.4.0 && git push origin v1.4.0
# Run it by hand (Actions > Release > Run workflow) to just build the packages.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config zip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deb cargo-generate-rpm --locked
      - run: cargo test --release
      - run: tools/build-extension.sh
      - run: cargo build --release
      - run: cargo deb --no-build
      - run: cargo generate-rpm
      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./target/debian/*.deb
          turbodm --version
          test -f /etc/apt/sources.list.d/turbodm.sources
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  rpm-test:
    name: Fedora install test
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:41
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
      - run: dnf install -y ./generate-rpm/*.x86_64.rpm && turbodm --version

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit only: MSYS2 no longer builds Rust or GTK 4 for 32-bit Windows
          - { msystem: UCRT64, arch: x64 }
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git zip
          pacboy: gcc:p pkgconf:p rust:p gtk4:p librsvg:p nasm:p vulkan-loader:p
      - run: tools/build-extension.sh
      - run: cargo build --release
      - run: packaging/windows/bundle.sh
      - name: Hide the build machine's own Vulkan loader (PCs without a Vulkan driver lack it)
        shell: pwsh
        run: |
          $dll = "$env:SystemRoot\System32\vulkan-1.dll"
          if (Test-Path $dll) {
            takeown /f $dll | Out-Null
            icacls $dll /grant "*S-1-5-32-544:F" | Out-Null
            Rename-Item $dll vulkan-1.dll.hidden
          }
      - name: Smoke test (app, browser connector, single instance)
        shell: pwsh
        run: |
          $exe = "dist\windows\TurboDM\bin\turbodm.exe"
          # a missing DLL shows an error box instead of failing: wait with a timeout
          $check = Start-Process $exe -ArgumentList "--version" -PassThru
          if (-not $check.WaitForExit(30000) -or $check.ExitCode -ne 0) { throw "turbodm.exe doesn't start (missing DLL?)" }
          Start-Process $exe
          Start-Sleep 8
          if (-not (Get-Process turbodm -ErrorAction SilentlyContinue)) { throw "TurboDM didn't stay running" }
          python packaging/windows/smoke_test.py $exe
          if ($LASTEXITCODE) { throw "native host test failed" }
          reg query "HKCU\Software\Google\Chrome\NativeMessagingHosts\com.xsobhi.turbodm"
          if ($LASTEXITCODE) { throw "not registered for Chrome" }
          Start-Process $exe -ArgumentList "https://github.com/xsobhi/turbodm/archive/refs/heads/main.zip"
          Start-Sleep 6
          if ((Get-Process turbodm).Count -ne 1) { throw "a second instance kept running" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $image.Save("$PWD\windows-screenshot.png")
          Stop-Process -Name turbodm
      - name: GUI test (centred windows, Hide details)
        shell: pwsh
        run: packaging\windows\gui_test.ps1 -Exe "$PWD\dist\windows\TurboDM\bin\turbodm.exe"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DVersion=$version" "/DArch=${{ matrix.arch }}" packaging\windows\turbodm.iss
          if ($LASTEXITCODE) { throw "installer build failed" }
          Compress-Archive -Path dist\windows\TurboDM -DestinationPath "dist\windows\TurboDM-$version-windows-${{ matrix.arch }}-portable.zip"
      - name: Install test (silent install for all users, then the installer's first page)
        shell: pwsh
        run: |
          $setup = Get-Item dist\windows\*-setup.exe
          # (not -Wait: that also waits for TurboDM, which a silent install opens afterwards)
          $silent = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $silent.WaitForExit(300000)) { throw "the silent install didn't finish" }
          Start-Sleep 5
          if (-not (Get-Process turbodm -ErrorAction SilentlyContinue)) { throw "TurboDM wasn't reopened after the update" }
          if (-not (Test-Path "$env:ProgramFiles\TurboDM\bin\turbodm.exe")) { throw "not installed in Program Files" }
          reg query "HKLM\Software\Mozilla\NativeMessagingHosts\com.xsobhi.turbodm"
          if ($LASTEXITCODE) { throw "browser connector not registered for all users" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          function Shot($file) {
            $image = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($image).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $image.Save("$PWD\$file")
          }
          # click through the wizard (installed already, so: welcome → installing → finish)
          Stop-Process -Name turbodm -ErrorAction SilentlyContinue
          $wizard = Start-Process $setup -PassThru
          $shell = New-Object -ComObject WScript.Shell
          Start-Sleep 6
          Shot "installer-1-welcome.png"
          $null = $shell.AppActivate($wizard.Id); $shell.SendKeys("{ENTER}")
          Start-Sleep 15
          Shot "installer-2-finished.png"
          $null = $shell.AppActivate($wizard.Id); $shell.SendKeys("{ENTER}")
          if (-not $wizard.WaitForExit(20000)) { $wizard | Stop-Process -Force; throw "the wizard didn't finish" }
          Start-Sleep 4
          Shot "installer-3-opened-app.png"
          Stop-Process -Name turbodm -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: "*.png"

  release:
    name: GitHub release
    needs: [linux, rpm-test, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" # checkout drops the tag's message
          {
            echo "## What's new"   # git drops '#' lines from tag messages
            echo
            git tag -l --format='%(contents:body)' "$tag"
            echo
            cat packaging/release-notes.md
          } > notes.md
          gh release create "$tag" --title "TurboDM ${tag#v}" --notes-file notes.md \
            $(find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.zip' \))

  apt:
    name: apt repository
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Import signing key
        run: echo "${{ secrets.APT_SIGNING_KEY }}" | gpg --batch --import
      - name: Update the repository on gh-pages
        run: |
          git fetch origin gh-pages && git worktree add repo origin/gh-pages || git worktree add --orphan -b gh-pages repo
          packaging/apt/update-repo.sh repo $(find artifacts -name '*.deb')
          cp packaging/apt/index.html packaging/linux/turbodm.sources repo/
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt repository: ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages
